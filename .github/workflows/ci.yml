name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the image used in docker-compose.yml.
        image: postgres:15-alpine
        env:
          POSTGRES_DB: mobile_shop_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DEBUG=True mirrors how the suite runs locally. Under DEBUG=False the
      # SECURE_SSL_REDIRECT block would 301 every test-client request away
      # from http:// and fail the whole suite.
      DEBUG: 'True'
      SECRET_KEY: ci-only-not-a-real-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: mobile_shop_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the version in runtime.txt so CI tests what deploys.
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for models changed without a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

      - name: Build static files
        run: python manage.py collectstatic --no-input

  # Deploys only after `test` passes. Inert until you opt in:
  #   1. Turn OFF auto-deploy for the service in the Render dashboard —
  #      while it is on, Render deploys straight from the push and this job
  #      has nothing left to gate.
  #   2. Add the service's Deploy Hook URL as the RENDER_DEPLOY_HOOK secret.
  # With no secret set the step is skipped, so CI stays green either way.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set — skipping (Render is presumably still auto-deploying)."
            exit 0
          fi
          curl --fail --silent --show-error "$HOOK"
          echo "Deploy triggered."
