services:
  # 💾 PostgreSQL Relational Database Service
  db:
    image: postgres:15-alpine
    container_name: techvault_postgres_container
    restart: always
    environment:
      - POSTGRES_DB=mobile_shop_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ⚡ Redis In-Memory Task Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: techvault_redis_container
    restart: always
    ports:
      - "6379:6379"

  # 🐍 Django Primary Monolith & API Gateway
  web:
    build: .
    container_name: techvault_django_monolith
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mobile_shop_db
      - DB_NAME=mobile_shop_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
      - FLASK_PDF_SERVICE_URL=http://flask_service:8002
      - FASTAPI_SERVICE_URL=http://fastapi_service:8001
    depends_on:
      - db
      - redis

  # ⚙️ Celery Asynchronous Background Task Worker
  celery_worker:
    build: .
    container_name: techvault_celery_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - web
      - redis

  # 🚀 FastAPI Stock Engine Microservice (Port 8001)
  fastapi_service:
    build: .
    container_name: techvault_fastapi_service
    ports:
      - "8001:8001"
    command: uvicorn fastapi_service.main:app --host 0.0.0.0 --port 8001
    environment:
      - DB_HOST=db
    depends_on:
      - db

  # 📄 Flask PDF Invoice Microservice (Port 8002)
  flask_service:
    build: .
    container_name: techvault_flask_service
    ports:
      - "8002:8002"
    command: python invoice_service/app.py
    environment:
      - DB_HOST=db
    depends_on:
      - db

volumes:
  postgres_data:
